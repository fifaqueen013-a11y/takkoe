<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kledingmenu voorbeeld</title>
<style>
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#2b3a4a,#1a1f26);font-family:Inter,system-ui,sans-serif;color:#c1c2c5;display:flex;gap:24px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start;padding:40px 16px;box-sizing:border-box}
.menu{width:300px;max-width:100%}
.title{background:#25262b;border-radius:4px;padding:10px;text-align:center;font-weight:600;color:#fff;margin-bottom:8px;position:relative}
.title .back{position:absolute;left:10px;top:9px;color:#909296}
.opt{background:#25262b;border-radius:4px;padding:10px 12px;margin-bottom:6px;display:flex;gap:12px;align-items:center;cursor:pointer}
.opt:hover{background:#2c2e33}
.ic{width:22px;text-align:center;font-size:18px}
.t{color:#fff;font-size:14px}.d{font-size:12px;color:#909296;margin-top:2px}
.arrow{margin-left:auto;color:#909296}
.label{width:100%;text-align:right;color:#fff;opacity:.6;font-size:13px}
.textui{position:fixed;left:16px;top:50%;background:#25262b;color:#fff;padding:10px 14px;border-radius:4px;font-size:14px}
</style></head><body>
<div class="textui">[E] Kledingkast Politiebureau</div>
<div class="menu">
  <div class="title">Kledingmenu</div>
  <div class="opt"><span class="ic">👕</span><div><div class="t">Kleding aanpassen</div><div class="d">Open de illenium-appearance kledingwinkel</div></div></div>
  <div class="opt"><span class="ic">🗂️</span><div><div class="t">Outfits</div><div class="d">Kies een voorbeeld outfit</div></div><span class="arrow">›</span></div>
  <div class="opt"><span class="ic">💾</span><div><div class="t">Opgeslagen outfits</div><div class="d">Je eigen outfits uit illenium-appearance</div></div></div>
  <div class="opt"><span class="ic">🎩</span><div class="t">Hoed af/op</div></div>
  <div class="opt"><span class="ic">👓</span><div class="t">Bril af/op</div></div>
  <div class="opt"><span class="ic">🎭</span><div class="t">Masker af/op</div></div>
</div>
<div class="menu">
  <div class="title"><span class="back">‹</span>Voorbeeld outfits</div>
  <div class="opt"><span class="ic">👕</span><div class="t">Casual</div></div>
  <div class="opt"><span class="ic">👔</span><div class="t">Pak</div></div>
</div>
</body></html>
